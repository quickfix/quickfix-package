name: Build Wheels (Test)

on:
  push:
    branches:
      - wheel-test
  pull_request:
    branches:
      - wheel-test
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13]
        python-version: ["3.11", "3.14"]

    # Optional: don't fail the whole job if 3.14 is flaky
    continue-on-error: ${{ matrix.python-version == '3.14' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout quickfix code
        uses: actions/checkout@v4
        with:
          repository: pablodcar/quickfix
          ref: master
          path: quickfix

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip & build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          ./setup-linux-yum.sh

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          ./setup-osx.sh

      - name: Build wheel
        run: |
          ./build.sh

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
